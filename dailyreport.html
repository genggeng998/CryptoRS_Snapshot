<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日报 · 入口</title>
<style>
  :root { --bg:#0f1418; --card:#171f25; --line:#2a343c; --text:#d9dfe2; --muted:#89949b; --accent:#4da6b3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 48px 20px;
  }
  .main { width: 100%; max-width: 460px; text-align: center; }
  h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
  .sub { margin: 0 0 30px; color: var(--muted); font-size: 13px; }
  .list { display: flex; flex-direction: column; gap: 14px; }
  .big {
    display: block; padding: 22px 18px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--card); color: var(--text); font-size: 20px; font-weight: 600;
    text-decoration: none; letter-spacing: 1px; transition: border-color .15s, transform .15s, color .15s;
  }
  a.big:hover, a.big:focus-visible {
    border-color: var(--accent); color: #fff; transform: translateY(-1px); outline: none;
  }
  .big.off { opacity: .42; cursor: not-allowed; }
  .big .tag {
    display: inline-block; margin-left: 10px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 500;
    letter-spacing: 0; vertical-align: 2px;
  }
</style>
</head>
<body>
<div class="main">
  <h1>📰 日报</h1>
  <p class="sub">选择一个市场查看当日日报</p>
  <div class="list">
    <a class="big" href="dailyreport_crypto.html" target="_self" rel="noopener">加密货币</a>
    <a class="big" href="dailyreport_us.html" target="_self" rel="noopener">美股</a>
    <a class="big" href="dailyreport_a.html" target="_self" rel="noopener">A股</a>
  </div>
</div>
</body>
</html>
